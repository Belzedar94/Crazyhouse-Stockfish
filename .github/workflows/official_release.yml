name: Crazyhouse stable release (G15 gated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked-before-g15:
    name: Stable publication is not authorized
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse inherited release path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Crazyhouse stable publication is disabled until the exact-candidate draft passes G15 and the owner explicitly authorizes publication."
          exit 1
